# Nginx configuration for Project Leroy.
#
# Production (Pi, via install-pi5.sh) serves over HTTPS (443) with a
# self-signed cert in /etc/nginx/ssl/ and redirects HTTP -> HTTPS.
# This file is the reference for local/dev (docker) installs, which run
# plain HTTP for the web preview; mirror the 443 ssl block below on the
# Pi (install-pi5.sh already does this) to enable HTTPS in production.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (CSS, JS) for 10 minutes for dev convenience
    location ~* \.(css|js)$ {
        expires 10m;
        add_header Cache-Control "public, must-revalidate";
    }

    # Serve classified images
    # For Docker: /var/www/html/classified (mounted separately)
    # For Pi: /var/www/html/classified (same path)
    location /classified/ {
        alias /var/www/html/classified/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Serve visitations.json
    location /visitations.json {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Serve detected videos
    location /detected/ {
        alias /home/leroy/Projects/project-leroy/storage/detected/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

